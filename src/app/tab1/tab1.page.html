<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="primary">
      <ion-button (click)="deconnecter()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Acceuil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

@for(lis of listm;track lis){
  <h3 class="ion-padding"> Utilisateur : {{lis.name}}</h3>
<div class="horizontal-scroll">
  <div class="horizontal-container">
    @for(film of lis.common;track film){
    <ion-card class="horizontal-card">
      <div class="image-container">
            <img [src]="film.imageUrl" alt="{{ film.title }}" />
          </div>
          <ion-card-header>
            <ion-card-title>{{ film.title }}</ion-card-title>
            <ion-card-subtitle>
              <div>{{ film.categorie }} | {{ film.releaseDate }} | {{ film.rating }} ★</div>
              <div class="desc">{{ film.description }}</div>
            </ion-card-subtitle>
          </ion-card-header>
      </ion-card>
    }
  </div>
</div>
}
</ion-content>
