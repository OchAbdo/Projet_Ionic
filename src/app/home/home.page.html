<ion-content class="home-background">

  <ion-grid>
    <ion-row>

      <ion-col class="ion-text-center">
        <ion-title> CinShare</ion-title>
      </ion-col>
    </ion-row>
    <ion-row style="margin-top: 30px;">
      <ion-col class="ion-text-center" >
        <h4>Votre univers cinématographique à portée de main.</h4>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="2" sizeSm="2" sizeMd="2" sizeLg="2" sizeXl="3"></ion-col>
      <ion-col class="ion-text-center" size="8" sizeSm="8" sizeMd="8" sizeLg="8" sizeXl="6">
        <p>Organisez, découvrez et gérez tous vos films préférés en toute simplicité. Plongez dans une expérience
          cinématographique unique.</p>
      </ion-col>
      <ion-col size="2" sizeSm="2" sizeMd="2" sizeLg="2" sizeXl="3"></ion-col>
    </ion-row>

    <ion-row style="padding-top: 30px">
        <ion-col size="2" sizeSm="2" sizeMd="2" sizeLg="2" sizeXl="3"></ion-col>
      <ion-col class="ion-text-center" size="8" sizeSm="8" sizeMd="8" sizeLg="8" sizeXl="6">
        <ion-button style="--background: #007bff;" expand="block" (click)="navigationAuth()">Se connecter</ion-button>
        <ion-button color="dark" expand="block" [routerLink]="['/signup']">S'inscrire</ion-button>
      </ion-col>
      <ion-col size="2" sizeSm="2" sizeMd="2" sizeLg="2" sizeXl="3"></ion-col>

    </ion-row>


  </ion-grid>


</ion-content>
