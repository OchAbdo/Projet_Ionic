<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-header">
    <img [src]="user.image" alt="Profile Photo" class="profile-photo" />

  </div>

  <ion-card class="info-card">
    <ion-card-header>
      <ion-card-title>Informations personnelles</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Nom</h3>
            <p>{{ user.nom}}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Email</h3>
            <p>{{ user.email }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="heart-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Favoris</h3>
            <p>{{ favoritesCount }} films aimés</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card class="actions-card">
    <ion-card-header>
      <ion-card-title>Actions</ion-card-title>
    </ion-card-header>
    <ion-card-content>


      <ion-button expand="block" color="medium" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Se déconnecter
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
