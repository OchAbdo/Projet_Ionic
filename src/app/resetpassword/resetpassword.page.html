<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Mot de Passe Oublié</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="forgot-bg" [fullscreen]="true">
  <div class="forgot-container">

    <h2 class="header-title">Mot de passe oublié ?</h2>

    <p class="subtitle">
      Entrez votre adresse e-mail ci-dessous pour recevoir un lien de réinitialisation de votre mot de passe.
    </p>
    <form #f="ngForm">
      <ion-item class="input-item">
        <!-- <ion-icon slot="start" name="mail-outline"></ion-icon> -->
        <ion-label position="stacked">Adresse email</ion-label>
        <ion-input type="email" name="email" #email="ngModel" ngModel required email
          placeholder="votre.email@exemple.com"></ion-input>
        @if(email.invalid && email.touched){
        <div class="error">
          Format Email invalide (xxx@xxx.xxx)!
        </div>
        }
      </ion-item>

      <ion-button [disabled]="f.invalid" expand="block" class="reset-btn" (click)="resetmotpass(f)">
        Réinitialiser le mot de passe
      </ion-button>
    </form>

  </div>
</ion-content>
